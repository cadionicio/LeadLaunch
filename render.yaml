services:
  - type: web
    name: leadlaunch-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITMO
        value: HS256
      - key: JWT_EXPIRA_MIN
        value: "1440"
      - key: GEMINI_API_KEY
        sync: false
